# Rebuilds the store from the official Omarchy package repo twice a day and
# commits the result; Netlify deploys every push to main, so new packages
# appear without anyone running build.py by hand.
name: Build and publish

on:
  schedule:
    - cron: "0 6,18 * * *" # 06:00 and 18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/deploy.yml"] # also run when this file changes

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python3 build.py
      - run: for t in tests/*.test.mjs; do node --test "$t"; done
      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data/omarchy.db netlify/functions/app-names.mjs netlify/functions/checklist.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Refresh package catalogue from pkgs.omarchy.org"
          git push
